name: Release

on:
  push:
    tags: ['v*']
  # Build-only smoke test. The release job below is gated on a tag, so a manual
  # run exercises the packaging — including the NSIS installer, which used to
  # fail silently — without creating a release or moving a tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned to the wails/v2 version in go.mod. A CLI newer than the library can
  # silently regenerate different bindings or a different NSIS template, so the
  # two move together or not at all.
  WAILS_VERSION: v2.15.0

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: fast-ip-changer-macos-universal
          - os: windows-latest
            platform: windows/amd64
            artifact: fast-ip-changer-windows-amd64
            nsis: '-nsis'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # wails.json's frontend:install is `npm install`; run `npm ci` first so
      # the lockfile is what actually decides the dependency tree. Wails' own
      # install step then no-ops.
      - run: npm ci
        working-directory: frontend

      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # `wails build -nsis` degrades to a warning when makensis is absent, which
      # is how v1.0.0 and v1.0.1 shipped without the installer the README
      # promised. The runner image does not carry NSIS, so install it here.
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          choco install nsis --no-progress --yes
          # choco writes the machine PATH, which a job already running does not
          # inherit — installing alone left makensis unfound and the build fell
          # back to its warning again. GITHUB_PATH puts it on PATH for the steps
          # that follow.
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      # Fails here, before a 13-second build, if the line above stopped working.
      - name: Check makensis is on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: makensis -VERSION

      # wails build runs frontend:install and frontend:build before compiling
      # Go, so frontend/dist is populated by the time //go:embed reads it.
      - run: wails build -platform ${{ matrix.platform }} ${{ matrix.nsis }}

      # The point of the step above: turn the silent warning into a failure. Two
      # files are expected on Windows — the app exe and the installer — and a
      # release missing the installer should not reach the upload step.
      - name: Check the installer was produced
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          installer=$(find build/bin -maxdepth 1 -name '*installer*.exe' -print -quit)
          if [ -z "$installer" ]; then
            echo "::error::no NSIS installer in build/bin — wails build -nsis fell back to a warning"
            ls -la build/bin
            exit 1
          fi
          echo "installer: $installer"

      # upload-artifact drops the executable bit and does not follow symlinks,
      # which leaves a raw .app upload unusable. Zip it with ditto first.
      - name: Package .app
        if: runner.os == 'macOS'
        run: |
          shopt -s nullglob
          apps=(build/bin/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::no .app found in build/bin"
            exit 1
          fi
          ditto -c -k --keepParent "${apps[0]}" "build/bin/${{ matrix.artifact }}.zip"
          rm -rf "${apps[0]}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    # Tags only. A workflow_dispatch run is a packaging smoke test and must not
    # create a release or attach assets to one.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The published binaries are unsigned, so a checksum list is the only way
      # a downloader can tell a release file apart from something that was
      # tampered with in transit. The lines carry bare filenames rather than the
      # artifacts/<name>/ paths, because that is what a browser saves them as:
      # `shasum -a 256 -c SHA256SUMS.txt` then works in the download directory
      # with no editing. Written outside artifacts/ so it does not also match the
      # artifacts/**/* upload pattern and get attached twice.
      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          set -eu
          files=$(find . -type f -print | sort)
          if [ -z "$files" ]; then
            echo "::error::no artifacts to checksum"
            exit 1
          fi
          # Two artifacts sharing a filename would produce two lines that cannot
          # both be verified from one directory. Fail rather than ship that.
          dupes=$(printf '%s\n' "$files" | xargs -n1 basename | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::duplicate artifact filenames: $dupes"
            exit 1
          fi
          out="$GITHUB_WORKSPACE/SHA256SUMS.txt"
          : > "$out"
          printf '%s\n' "$files" | while IFS= read -r f; do
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" ) >> "$out"
          done
          cat "$out"

      # Draft, not published: the artifacts are unsigned, so they get downloaded
      # and hand-tested on both platforms before anyone else sees them.
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*
            SHA256SUMS.txt
