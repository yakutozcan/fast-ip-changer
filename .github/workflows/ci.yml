name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    # The matrix is native rather than GOOS= cross-compilation on purpose: the
    # per-platform files in pkg/sysexec are only ever compiled by the runner
    # they target, and ubuntu is the only job that compiles elevate_other.go /
    # hide_other.go or runs the "unsupported platform" branch. Linux is a
    # coverage target, not a shipping target.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # Runs on all three runners rather than once on ubuntu because each OS
      # compiles a different file in pkg/sysexec, and a linter only sees the
      # variant its GOOS selects. The prebuilt binary from the action is used
      # instead of `go run`, which would compile golangci-lint from source on
      # every runner for longer than the lint itself takes. The version is
      # pinned for the reason CONTRIBUTING.md pins the Wails CLI: a new release
      # can add checks and turn an unrelated pull request red.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      # -race matters here: diagnostics.QuickCheck fans out three goroutines,
      # and the cancellable-run slot in that package is shared mutable state.
      #
      # shell: bash on every runner, not just for consistency: under the Windows
      # default (pwsh) this wrote the profile as `coverage`, losing the `.out`,
      # and the next step then had no coverage.out to read. Running both steps in
      # the same shell keeps the filename and the working directory identical
      # across the matrix.
      - name: go test
        shell: bash
        run: go test ./... -race -covermode=atomic -coverprofile='coverage.out'

      # Reported, not gated. Coverage differs by runner on purpose — each OS
      # compiles a different set of the pkg/sysexec files — so a single
      # threshold would either be met trivially or block the platform that
      # cannot reach it. The per-package numbers are here to be read in the job
      # summary when a change moves them.
      - name: Coverage summary
        shell: bash
        run: |
          set -eu
          profile=coverage.out
          # Fails with the directory listing rather than with awk's "cannot open
          # file", which is what the Windows profile-name bug above first looked
          # like.
          if [ ! -f "$profile" ]; then
            echo "::error::coverage profile not found. pwd=$(pwd)"
            ls -la
            exit 1
          fi
          # Aggregated from the profile rather than from `go tool cover -func`,
          # whose per-function list is too long to read and cannot be averaged
          # into a package number without weighting by statement count. Profile
          # lines are `path:from.col,to.col <statements> <hits>`.
          {
            echo "### Coverage (${{ matrix.os }})"
            echo
            echo '```'
            awk 'NR > 1 {
              split($1, a, ":"); path = a[1];
              n = split(path, p, "/"); pkg = p[1];
              for (i = 2; i < n; i++) pkg = pkg "/" p[i];
              stmts[pkg] += $2; if ($3 > 0) covered[pkg] += $2;
              total += $2; if ($3 > 0) hit += $2;
            }
            END {
              for (k in stmts) printf "%-58s %5.1f%%\n", k, 100 * covered[k] / stmts[k];
              printf "%-58s %5.1f%%\n", "total", 100 * hit / total;
            }' "$profile" | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: error

      # golangci-lint's gofmt formatter reports the same thing on every runner;
      # this step stays because it lists every offending file at once, and one
      # runner is enough for that. .gitattributes pins the tree to LF, without
      # which a Windows checkout reports every CRLF-converted file here.
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Vite requires ^20.19 || >=22.12, so '22' resolves to a usable 22.x.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # oxlint's findings are warnings by default; the script passes
      # --deny-warnings so any of them fail the job.
      - run: npm run lint

      # Type-checks src and vite.config.ts. Also the backstop for stale Wails
      # bindings: a change to app.go without `wails generate module` fails here.
      - run: npm run typecheck

      # Vitest. Runs before the build because it is the faster of the two and
      # covers the pure logic in src/lib that the build cannot check.
      - run: npm run test

      - run: npm run build
